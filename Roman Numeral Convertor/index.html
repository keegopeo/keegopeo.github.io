<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <section id="section-1">
      <h1 class="main-title">Roman Numeral Convertor</h1>
      <form id="submit-form">
        <label for="number">
        Enter Number:
          <input type="number" id="number" placeholder="Enter number here" required />
        </label>
      <button type="submit" id="convert-btn">
          Submit
      </button>
      </form>
    </section>
    <section id="section-2">
      <div id="output"></div>
      <p id="rules">
        Roman numerals are based on seven symbols and can be written using various combinations to represent Arabic numerals.For Example:
      </p>
      <table id="rules-table">
        <caption>Roman Numeral Table</caption>
        <tr>
          <th>Roman Numerals</th>
          <th>
            Arabic Numerals
          </th>
        </tr>
        <tr>
          <td>M</td>
          <td>1000</td>
        </tr>
        <tr>
          <td>CM</td>
          <td>900</td>
        </tr>
        <tr>
          <td>D</td>
          <td>500</td>
        </tr>
        <tr>
          <td>CD</td>
          <td>400</td>
        </tr>
        <tr>
          <td>C</td>
          <td>100</td>
        </tr>
        <tr>
          <td>XC</td>
          <td>90</td>
        </tr>
        <tr>
          <td>L</td>
          <td>50</td>
        </tr>
        <tr>
          <td>XL</td>
          <td>40</td>
        </tr>
        <tr>
          <td>X</td>
          <td>10</td>
        </tr>
        <tr>
          <td>IX</td>
          <td>9</td>
        </tr>
        <tr>
          <td>V</td>
          <td>5</td>
        </tr>
        <tr>
          <td>IV</td>
          <td>4</td>
        </tr>
        <tr>
          <td>I</td>
          <td>1</td>
        </tr>
      </table>
    </section>
    <script src="script.js"></script>
  </body>
</html>
